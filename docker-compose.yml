services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hostel_pro2
      POSTGRES_USER: db_user1
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Raju987.}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user1 -d hostel_pro2"]
      interval: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgresql://db_user1:${DB_PASSWORD:-Raju987.}@db:5432/hostel_pro2
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me}
      BETTER_AUTH_URL: http://localhost:3005
    env_file: .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
